<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>产品演示 · 引导局部视线</title>
  <link rel="stylesheet" href="../public/brand/brand.css">
  <link rel="stylesheet" href="motion.css">
</head>
<body class="product" data-motion="product" data-duration="4.5">
  <main class="product-layout">
    <div class="eyebrow" id="product-kicker">操作 / 03</div>
    <header class="product-head">
      <h1 id="product-title">让观众知道看哪里。</h1>
      <p id="product-note">先看全局，再聚焦一个操作。<br>最后留时间读清标注。</p>
    </header>
    <div class="product-frame">
      <section id="product-capture" class="capture" aria-label="示意界面，可替换为真实截图">
        <div class="capture-top"><span>界面占位 / 请换真实素材</span><span>01 — 03</span></div>
        <div class="capture-body"><div class="ghost-nav" aria-hidden="true"><i></i><i></i><i></i></div><div class="ghost-content"><div class="ghost-lines" aria-hidden="true"><i></i><i></i></div><div class="focus-target" id="product-target">导出结果</div></div></div>
      </section>
      <p class="callout" id="product-callout">焦点：只标关键操作</p>
    </div>
  </main>
  <script src="motion.js"></script>
</body>
</html>
